<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Desk Dashboard</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0c0e;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}
*{-webkit-box-sizing:border-box;box-sizing:border-box}
#app{width:100%;height:100%;padding:20px 24px}
.header{height:145px;border-bottom:1px solid #292b30;position:relative}
.time{font-size:82px;font-weight:200;letter-spacing:-3px;line-height:90px}
.date{font-size:20px;color:#b7bac1;margin-top:5px}
.place{position:absolute;right:0;top:12px;text-align:right}
.temp{font-size:48px;font-weight:300}
.weatherText{font-size:17px;color:#b7bac1;margin-top:3px}
.content{display:table;width:100%;height:570px;table-layout:fixed;border-spacing:0}
.left,.right{display:table-cell;vertical-align:top;padding-top:20px}
.left{width:56%;padding-right:22px;border-right:1px solid #292b30}
.right{width:44%;padding-left:22px}
.label{font-size:12px;letter-spacing:1.6px;color:#858992;text-transform:uppercase;margin-bottom:12px}
.forecast{display:table;width:100%;margin-bottom:23px}
.fday{display:table-cell;width:33%;padding-right:10px}
.fname{font-size:14px;color:#b7bac1}
.ficon{font-size:30px;margin:7px 0}
.fdeg{font-size:20px}.muted{color:#858992}
.metrics{display:table;width:100%;border-top:1px solid #292b30;border-bottom:1px solid #292b30;padding:13px 0;margin-bottom:20px}
.metric{display:table-cell;width:33%}
.mv{font-size:19px}.mk{font-size:11px;color:#858992;margin-top:4px;text-transform:uppercase}
.calendarTitle{font-size:24px;margin-bottom:12px}
.cal{width:100%;border-collapse:collapse;text-align:center;font-size:15px}
.cal th{font-size:11px;color:#858992;font-weight:400;padding:4px}
.cal td{height:31px;color:#d7d8dc}
.cal .dim{color:#4e5158}.cal .today span{display:inline-block;background:#f5f5f7;color:#0b0c0e;border-radius:50%;width:28px;height:28px;line-height:28px}
.note{margin-top:20px}
#note{width:100%;height:72px;resize:none;background:#15171b;color:#f5f5f7;border:1px solid #292b30;border-radius:10px;padding:11px;font-family:inherit;font-size:15px;outline:none}
.newsBox{margin-top:20px}
.newsItem{padding:10px 0;border-bottom:1px solid #292b30;font-size:14px;line-height:18px}
.newsItem a{color:#e9e9ec;text-decoration:none}
.status{position:absolute;bottom:8px;right:16px;color:#555960;font-size:10px}
</style>
</head>
<body>
<div id="app">
 <div class="header">
  <div class="time" id="clock">--:--</div>
  <div class="date" id="dateLine">–</div>
  <div class="place">
   <div class="temp" id="temp">--°</div>
   <div class="weatherText" id="weatherText">Köln · Wetter lädt…</div>
  </div>
 </div>
 <div class="content">
  <div class="left">
   <div class="label">Wetter · Köln</div>
   <div class="forecast" id="forecast">
    <div class="fday"><div class="fname">Heute</div><div class="ficon">·</div><div class="fdeg">--°</div></div>
    <div class="fday"><div class="fname">Morgen</div><div class="ficon">·</div><div class="fdeg">--°</div></div>
    <div class="fday"><div class="fname">Übermorgen</div><div class="ficon">·</div><div class="fdeg">--°</div></div>
   </div>
   <div class="metrics">
    <div class="metric"><div class="mv" id="rain">--%</div><div class="mk">Regen</div></div>
    <div class="metric"><div class="mv" id="sunrise">--:--</div><div class="mk">Sonnenaufgang</div></div>
    <div class="metric"><div class="mv" id="sunset">--:--</div><div class="mk">Sonnenuntergang</div></div>
   </div>
   <div class="label">Heute wichtig</div>
   <textarea id="note" placeholder="Kurze Notiz …" onkeyup="saveNote()" onchange="saveNote()"></textarea>
   <div class="newsBox">
    <div class="label">Ṣalāh-Zeiten · Köln</div>
    <div id="prayers"><div class="newsItem muted">Gebetszeiten werden geladen…</div></div>
   </div>
  </div>
  <div class="right">
   <div class="label">Kalender</div>
   <div class="calendarTitle" id="monthTitle"></div>
   <table class="cal"><thead><tr><th>MO</th><th>DI</th><th>MI</th><th>DO</th><th>FR</th><th>SA</th><th>SO</th></tr></thead><tbody id="calendarBody"></tbody></table>
  </div>
 </div>
 <div class="status" id="status"></div>
</div>
<script>
var DAYS=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"];
var MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function pad(n){return n<10?"0"+n:n}
function weekNumber(d){var x=new Date(d.getTime());x.setHours(0,0,0,0);x.setDate(x.getDate()+3-(x.getDay()+6)%7);var w1=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w1)/86400000-3+(w1.getDay()+6)%7)/7)}
function tick(){var d=new Date();document.getElementById("clock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());document.getElementById("dateLine").innerHTML=DAYS[d.getDay()]+" · "+d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear()+" · KW "+weekNumber(d)}
setInterval(tick,1000);tick();

function drawCalendar(){
 var d=new Date(), y=d.getFullYear(), m=d.getMonth(), first=new Date(y,m,1), offset=(first.getDay()+6)%7, days=new Date(y,m+1,0).getDate(), prev=new Date(y,m,0).getDate();
 document.getElementById("monthTitle").innerHTML=MONTHS[m]+" "+y;
 var html="",n=1,next=1;
 for(var r=0;r<6;r++){html+="<tr>";for(var c=0;c<7;c++){var pos=r*7+c, val,cls="";
   if(pos<offset){val=prev-offset+pos+1;cls="dim";}
   else if(n<=days){val=n;if(n==d.getDate())cls="today";n++;}
   else{val=next++;cls="dim";}
   html+='<td class="'+cls+'"><span>'+val+"</span></td>";
 }html+="</tr>";}
 document.getElementById("calendarBody").innerHTML=html;
} drawCalendar();

try{document.getElementById("note").value=localStorage.getItem("deskNote")||""}catch(e){}
function saveNote(){try{localStorage.setItem("deskNote",document.getElementById("note").value)}catch(e){}}

function codeText(c){if(c===0)return["☀","Klar"];if(c<=3)return["⛅","Leicht bewölkt"];if(c<=48)return["☁","Bewölkt"];if(c<=67)return["☂","Regen"];if(c<=77)return["❄","Schnee"];if(c<=82)return["☂","Schauer"];if(c<=99)return["⚡","Gewitter"];return["·","Wetter"]}
function hhmm(s){if(!s)return"--:--";return s.substring(11,16)}
function loadWeather(){
 var url="https://api.open-meteo.com/v1/forecast?latitude=50.9375&longitude=6.9603&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=Europe%2FBerlin&forecast_days=3";
 var x=new XMLHttpRequest();x.onreadystatechange=function(){if(x.readyState===4){try{
  var j=JSON.parse(x.responseText), cur=j.current,dy=j.daily,ct=codeText(cur.weather_code);
  document.getElementById("temp").innerHTML=Math.round(cur.temperature_2m)+"°";
  document.getElementById("weatherText").innerHTML="Köln · "+ct[1];
  var names=["Heute","Morgen","Übermorgen"],s="";
  for(var i=0;i<3;i++){var w=codeText(dy.weather_code[i]);s+='<div class="fday"><div class="fname">'+names[i]+'</div><div class="ficon">'+w[0]+'</div><div class="fdeg">'+Math.round(dy.temperature_2m_max[i])+'° <span class="muted">'+Math.round(dy.temperature_2m_min[i])+'°</span></div></div>'}
  document.getElementById("forecast").innerHTML=s;
  document.getElementById("rain").innerHTML=dy.precipitation_probability_max[0]+"%";
  document.getElementById("sunrise").innerHTML=hhmm(dy.sunrise[0]);document.getElementById("sunset").innerHTML=hhmm(dy.sunset[0]);
  document.getElementById("status").innerHTML="Wetter aktualisiert "+pad(new Date().getHours())+":"+pad(new Date().getMinutes());
 }catch(e){document.getElementById("weatherText").innerHTML="Köln · Wetter nicht verfügbar"}}};
 x.open("GET",url,true);x.send();
}loadWeather();setInterval(loadWeather,900000);



/* Ṣalāh-Zeiten Köln. Automatische tägliche Aktualisierung.
   Zeiten werden online für Köln berechnet; keine privaten Daten nötig. */
function shortTime(t){if(!t)return"--:--";return t.split(" ")[0]}
function loadPrayers(){
 var d=new Date(), date=pad(d.getDate())+"-"+pad(d.getMonth()+1)+"-"+d.getFullYear();
 var url="https://api.aladhan.com/v1/timingsByCity/"+date+"?city=Cologne&country=Germany&method=3";
 var x=new XMLHttpRequest();
 x.onreadystatechange=function(){
  if(x.readyState===4){
   try{
    var j=JSON.parse(x.responseText),t=j.data.timings;
    var items=[
      ["Fajr",t.Fajr],
      ["Sonnenaufgang",t.Sunrise],
      ["Dhuhr",t.Dhuhr],
      ["Asr",t.Asr],
      ["Maghrib",t.Maghrib],
      ["Isha",t.Isha]
    ];
    var s="";
    for(var i=0;i<items.length;i++){
      s+='<div class="newsItem"><span>'+items[i][0]+'</span><span style="float:right;font-size:18px;font-weight:500">'+shortTime(items[i][1])+'</span><div style="clear:both"></div></div>';
    }
    document.getElementById("prayers").innerHTML=s;
   }catch(e){
    document.getElementById("prayers").innerHTML='<div class="newsItem muted">Ṣalāh-Zeiten derzeit nicht verfügbar.</div>';
   }
  }
 };
 x.open("GET",url,true);x.send();
}
loadPrayers();
setInterval(loadPrayers,3600000);
</script>
</body>
</html>
