<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Hasans Dashboard</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#0b0c0e;color:#f5f5f7;font-family:Arial,"Helvetica Neue",sans-serif;overflow:hidden}
*{box-sizing:border-box}.app{padding:18px 22px}.head{height:132px;border-bottom:1px solid #2b2d31;position:relative}
#clock{font-size:76px;font-weight:200;line-height:82px}.date{font-size:18px;color:#b9bbc1}.weather{position:absolute;right:0;top:7px;text-align:right}
#temp{font-size:46px}.sub{color:#a5a8af;font-size:14px}.cols{display:table;width:100%;table-layout:fixed}
.col{display:table-cell;vertical-align:top;padding-top:18px}.left{width:55%;padding-right:20px;border-right:1px solid #2b2d31}.right{width:45%;padding-left:20px}
.label{font-size:11px;letter-spacing:1.5px;color:#81858d;text-transform:uppercase;margin-bottom:10px}
.forecast{display:table;width:100%;margin-bottom:18px}.day{display:table-cell;width:33%}.day b{font-size:20px}.day span{display:block;color:#999da5;font-size:12px;margin-bottom:5px}
.prayerHero{background:#15171a;border:1px solid #2b2d31;border-radius:13px;padding:13px 15px;margin-bottom:13px}
#nextPrayer{font-size:25px}#countdown{font-size:14px;color:#b8bbc1;margin-top:4px}
.prayers{width:100%;border-collapse:collapse;font-size:14px}.prayers td{padding:7px 2px;border-bottom:1px solid #24262a}.prayers td:last-child{text-align:right;font-size:17px}
.calTitle{font-size:23px;margin-bottom:8px}.cal{width:100%;border-collapse:collapse;text-align:center}.cal th{font-size:10px;color:#7e828a;font-weight:normal;padding:4px}.cal td{height:29px;font-size:14px}.today span{display:inline-block;width:27px;height:27px;line-height:27px;border-radius:50%;background:#f5f5f7;color:#0b0c0e}
.dim{color:#4e5158}.noteLabel{margin-top:17px}textarea{width:100%;height:64px;background:#15171a;color:#fff;border:1px solid #2b2d31;border-radius:9px;padding:9px;font-size:14px;resize:none}
.foot{position:absolute;bottom:6px;right:14px;font-size:9px;color:#555a62}

/* Vollbild-Uhr + automatische Tag/Nacht-Darstellung */
body.light{background:#f3f4f6;color:#111214}
body.light .head,body.light .left{border-color:#d8d9dd}
body.light .sub,body.light .date{color:#62656c}
body.light .label{color:#6f737a}
body.light .prayerHero,body.light textarea{background:#fff;color:#111;border-color:#d8d9dd}
body.light .prayers td{border-color:#ddd}
.modeBtn{position:absolute;right:18px;bottom:12px;border:1px solid #3b3e44;background:#17191d;color:#fff;border-radius:9px;padding:8px 11px;font-size:13px;z-index:5}
body.light .modeBtn{background:#fff;color:#111;border-color:#ccc}
#clockMode{display:none;position:fixed;left:0;top:0;width:100%;height:100%;z-index:50;background:#08090a;text-align:center}
#clockMode.lightClock{background:#f7f7f7}
#bigClockWrap{position:absolute;left:0;top:50%;width:100%;margin-top:-145px}
#bigClock{font-size:190px;font-weight:200;letter-spacing:-8px;line-height:195px;white-space:nowrap}
#bigDate{font-size:24px;margin-top:8px;opacity:.72}
#bigPrayer{font-size:18px;margin-top:16px;opacity:.72}
#clockControls{position:absolute;left:0;bottom:22px;width:100%;text-align:center}
.colorDot{display:inline-block;width:27px;height:27px;border-radius:50%;margin:0 6px;border:2px solid rgba(255,255,255,.45);vertical-align:middle}
.lightClock .colorDot{border-color:rgba(0,0,0,.25)}
#closeClock{display:inline-block;margin-left:14px;padding:7px 11px;border:1px solid #555;border-radius:8px;font-size:12px;opacity:.8}


#fontPicker{display:inline-block;margin-left:12px;padding:7px 9px;border:1px solid #555;border-radius:8px;background:#17191d;color:#fff;font-size:12px}
.lightClock #fontPicker{background:#fff;color:#111;border-color:#bbb}
@media (max-width:800px){#bigClock{font-size:165px;line-height:170px}}


.themeBtns{position:absolute;right:112px;bottom:12px;z-index:6}
.themeBtns button{margin-left:4px;border:1px solid #3b3e44;background:#17191d;color:#fff;border-radius:8px;padding:7px 9px;font-size:12px}
body.light .themeBtns button{background:#fff;color:#111;border-color:#ccc}
.left{width:55%}.right{width:45%}
.noteLabel{margin-top:28px}
textarea{height:105px}

.citySwitch{margin-bottom:3px}.citySwitch button{border:1px solid #3b3e44;background:#17191d;color:#aaa;border-radius:7px;padding:4px 7px;margin-left:4px;font-size:10px}
.citySwitch button.active{color:#fff;border-color:#777}
body.light .citySwitch button{background:#fff;color:#777;border-color:#ccc}body.light .citySwitch button.active{color:#111;border-color:#777}
#bigWeather{font-size:18px;margin-top:12px;opacity:.72}
.sizeCtl{display:inline-block;padding:7px 9px;margin-left:5px;border:1px solid #555;border-radius:8px;font-size:12px}
</style>
</head>
<body><div class="app">
<div class="head"><div id="clock">--:--</div><button class="modeBtn" onclick="openClock()">Große Uhr</button><div class="themeBtns"><button onclick="setThemeMode('light')">☀</button><button onclick="setThemeMode('dark')">☾</button><button onclick="setThemeMode('auto')">A</button></div><div class="date" id="dateLine"></div>
<div class="weather"><div class="citySwitch"><button id="cityKoeln" onclick="setCity('koeln')">Köln</button><button id="cityFrankfurt" onclick="setCity('frankfurt')">Frankfurt</button></div><div id="temp">--°</div><div class="sub" id="weatherText">Wetter lädt…</div></div></div>
<div class="cols">
<div class="col left">
<div class="label" id="weatherLabel">Wetter</div><div class="forecast" id="forecast"></div>
<div class="label noteLabel">Heute wichtig</div><textarea id="note" placeholder="Kurze Notiz …"></textarea>
</div>
<div class="col right"><div class="label">Kalender</div><div class="calTitle" id="monthTitle"></div>
<table class="cal"><thead><tr><th>MO</th><th>DI</th><th>MI</th><th>DO</th><th>FR</th><th>SA</th><th>SO</th></tr></thead><tbody id="calBody"></tbody></table>
</div></div><div class="foot" id="updated"></div></div>
<script id="embeddedDashboardData">var DASHBOARD_DATA=null;</script>
<script>
var DAYS=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"],MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
function pad(n){return n<10?"0"+n:n} function wk(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+3-(x.getDay()+6)%7);var w=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w)/86400000-3+(w.getDay()+6)%7)/7)}
function tick(){var d=new Date();document.getElementById("clock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());document.getElementById("dateLine").innerHTML=DAYS[d.getDay()]+" · "+d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear()+" · KW "+wk(d)}
setInterval(tick,1000);tick();
function cal(){var d=new Date(),y=d.getFullYear(),m=d.getMonth(),f=new Date(y,m,1),o=(f.getDay()+6)%7,n=1,nx=1,prev=new Date(y,m,0).getDate(),max=new Date(y,m+1,0).getDate(),s="";
document.getElementById("monthTitle").innerHTML=MONTHS[m]+" "+y;for(var r=0;r<6;r++){s+="<tr>";for(var c=0;c<7;c++){var p=r*7+c,v,cl="";if(p<o){v=prev-o+p+1;cl="dim"}else if(n<=max){v=n;if(n==d.getDate())cl="today";n++}else{v=nx++;cl="dim"}s+='<td class="'+cl+'"><span>'+v+"</span></td>"}s+="</tr>"}document.getElementById("calBody").innerHTML=s}cal();
function xhrJSON(url,ok,fail){var x=new XMLHttpRequest();x.onreadystatechange=function(){if(x.readyState==4){if(x.status>=200&&x.status<300){try{ok(JSON.parse(x.responseText))}catch(e){if(fail)fail()}}else if(fail)fail()}};x.open("GET",url+"?v="+new Date().getTime(),true);x.send()}
var dashboardData=null;
function getCity(){var c="koeln";try{c=localStorage.getItem("weatherCity")||c}catch(e){}return c}
function setCity(c){try{localStorage.setItem("weatherCity",c)}catch(e){};renderSelectedCity()}
function renderSelectedCity(){
 if(!dashboardData)return;
 var c=getCity(),j=dashboardData.cities[c],name=c=="frankfurt"?"Frankfurt":"Köln";
 if(!j)return;
 document.getElementById("temp").innerHTML=Math.round(j.weather.current)+"°";
 document.getElementById("weatherText").innerHTML=name+" · "+j.weather.text;
 document.getElementById("weatherLabel").innerHTML="Wetter · "+name;
 var s="",i,q;
 for(i=0;i<j.weather.days.length;i++){q=j.weather.days[i];s+='<div class="day"><span>'+q.name+'</span><b>'+Math.round(q.max)+'°</b><div class="sub">'+Math.round(q.min)+'° · Regen '+q.rain+'%</div></div>'}
 document.getElementById("forecast").innerHTML=s;
 sunData=j.sun||null;
 document.getElementById("updated").innerHTML="Daten: "+dashboardData.updated;
 document.getElementById("cityKoeln").className=c=="koeln"?"active":"";
 document.getElementById("cityFrankfurt").className=c=="frankfurt"?"active":"";
 applyAutoTheme();updateBigClock();
}
function renderDashboardData(j){
 try{if(!j||!j.cities)return false;dashboardData=j;renderSelectedCity();return true}catch(e){return false}
}
function load(){
 if(typeof DASHBOARD_DATA!="undefined" && DASHBOARD_DATA){
  renderDashboardData(DASHBOARD_DATA);
  return;
 }
 xhrJSON("data.json",function(j){renderDashboardData(j)},function(){
  document.getElementById("weatherText").innerHTML="Köln · Daten nicht geladen";
 });
}
load();
setInterval(load,1800000);

function applyClockFont(){
 var v="helvetica";
 try{v=localStorage.getItem("clockFont")||v}catch(e){}
 var f='"Helvetica Neue",Helvetica,Arial,sans-serif';
 if(v=="arial")f='Arial,sans-serif';
 else if(v=="georgia")f='Georgia,serif';
 else if(v=="times")f='"Times New Roman",Times,serif';
 else if(v=="courier")f='"Courier New",Courier,monospace';
 else if(v=="trebuchet")f='"Trebuchet MS",Arial,sans-serif';
 document.getElementById("bigClock").style.fontFamily=f;
 var picker=document.getElementById("fontPicker");
 if(picker)picker.value=v;
}

function updateBigClock(){
 var d=new Date();
 document.getElementById("bigClock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());
 document.getElementById("bigDate").innerHTML=DAYS[d.getDay()]+" · "+d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear();
 
 var bw=document.getElementById("bigWeather");
 if(bw&&dashboardData){var c=getCity(),x=dashboardData.cities[c],nm=c=="frankfurt"?"Frankfurt":"Köln";if(x)bw.innerHTML=nm+" · "+Math.round(x.weather.current)+"° · "+x.weather.text}
 applyClockColor();applyClockFont();applyClockSize();
}
setInterval(updateBigClock,1000);updateBigClock();

function toMinutes(v){if(!v)return null;var a=v.split(":");return parseInt(a[0],10)*60+parseInt(a[1],10)}
function setThemeMode(v){
 try{localStorage.setItem("themeMode",v)}catch(e){}
 applyAutoTheme();
}
function applyAutoTheme(){
 var mode="auto";
 try{mode=localStorage.getItem("themeMode")||"auto"}catch(e){}
 var light=false;
 if(mode=="light")light=true;
 else if(mode=="dark")light=false;
 else{
  if(!sunData){light=true}
  else{
   var d=new Date(),now=d.getHours()*60+d.getMinutes(),rise=toMinutes(sunData.sunrise),set=toMinutes(sunData.sunset);
   light=!(now<rise || now>=set);
  }
 }
 document.body.className=light?"light":"";
 var cm=document.getElementById("clockMode");
 if(cm)cm.className=light?"lightClock":"";
}
setInterval(applyAutoTheme,60000);

</script>
<div id="clockMode" onclick="clockTap(event)">
 <div id="bigClockWrap">
  <div id="bigClock">--:--</div>
  <div id="bigDate"></div><div id="bigWeather"></div>
 </div>
 <div id="clockControls">
  <span class="colorDot" style="background:#ffffff" onclick="setClockColor('#ffffff');event.stopPropagation()"></span>
  <span class="colorDot" style="background:#39ff72" onclick="setClockColor('#39ff72');event.stopPropagation()"></span>
  <span class="colorDot" style="background:#48a7ff" onclick="setClockColor('#48a7ff');event.stopPropagation()"></span>
  <span class="colorDot" style="background:#ff4b4b" onclick="setClockColor('#ff4b4b');event.stopPropagation()"></span>
  <span class="colorDot" style="background:#ffb13b" onclick="setClockColor('#ffb13b');event.stopPropagation()"></span>
  <span class="colorDot" style="background:#d17cff" onclick="setClockColor('#d17cff');event.stopPropagation()"></span>
  <span class="sizeCtl" onclick="changeClockSize(-10);event.stopPropagation()">A−</span>
  <span class="sizeCtl" onclick="changeClockSize(10);event.stopPropagation()">A+</span>
  <select id="fontPicker" onchange="setClockFont(this.value);event.stopPropagation()" onclick="event.stopPropagation()">
   <option value="helvetica">Helvetica</option>
   <option value="arial">Arial</option>
   <option value="georgia">Georgia</option>
   <option value="times">Times</option>
   <option value="courier">Digital / Courier</option>
   <option value="trebuchet">Trebuchet</option>
  </select>
  <span id="closeClock" onclick="closeClock();event.stopPropagation()">Dashboard</span>
 </div>
</div>

</body></html>
