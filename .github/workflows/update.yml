name: Dashboard-Daten aktualisieren

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Wetter und Gebetszeiten laden
        run: python update_data.py

      - name: Neue Daten speichern
        run: |
          git config user.name "dashboard-bot"
          git config user.email "dashboard-bot@users.noreply.github.com"
          git add data.json index.html
          git diff --cached --quiet || git commit -m "Dashboard-Daten aktualisieren"
          git push
