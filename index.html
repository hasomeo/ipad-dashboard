<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Home Office</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,"Helvetica Neue",sans-serif}
body{background:#0a0b0d;color:#f7f7f8}
body.light{background:#f4f5f7;color:#111214}
.app{height:100%;padding:22px 26px}
.top{height:112px;border-bottom:1px solid #292c31;position:relative}
body.light .top{border-color:#d7d9dd}
.time{font-size:74px;line-height:72px;font-weight:200;letter-spacing:-3px}
.date{font-size:16px;margin-top:9px;opacity:.62}
.topRight{position:absolute;right:0;top:2px;text-align:right}
.city button,.theme button,.clockButton{font-size:11px;padding:6px 9px;margin-left:4px;border-radius:8px;border:1px solid #343840;background:#14161a;color:#aeb2b9}
.city button.active,.theme button.active{color:#fff;border-color:#727780}
body.light .city button,body.light .theme button,body.light .clockButton{background:#fff;color:#686b70;border-color:#d0d2d6}
body.light .city button.active,body.light .theme button.active{color:#111;border-color:#777}
.clockButton{margin-top:10px;font-size:12px}
.grid{display:table;width:100%;table-layout:fixed;padding-top:22px}
.left,.right{display:table-cell;vertical-align:top;width:50%}
.left{padding-right:28px}.right{padding-left:28px;border-left:1px solid #292c31}
body.light .right{border-color:#d7d9dd}
.eyebrow{font-size:10px;letter-spacing:1.7px;text-transform:uppercase;opacity:.48;margin-bottom:10px}
.temp{font-size:62px;line-height:62px;font-weight:200;letter-spacing:-3px}
.condition{font-size:17px;margin-top:5px;opacity:.68}
.range{font-size:13px;margin-top:7px;opacity:.5}
.forecast{display:table;width:100%;margin-top:28px}
.day{display:table-cell;width:33.33%;padding-right:10px}
.dayName{font-size:11px;opacity:.45}.dayTemp{font-size:23px;margin-top:5px}.daySub{font-size:11px;opacity:.45;margin-top:3px}
.noteTitle{margin-top:28px}
textarea{width:100%;height:80px;border:0;border-bottom:1px solid #33373d;background:transparent;color:inherit;font-size:14px;padding:8px 0;resize:none;outline:none}
body.light textarea{border-color:#cfd1d5}
.month{font-size:25px;margin-bottom:10px}
.cal{width:100%;border-collapse:collapse;text-align:center}
.cal th{font-size:9px;font-weight:normal;opacity:.38;padding:5px}
.cal td{height:32px;font-size:13px}
.cal .dim{opacity:.2}.cal .today span{display:inline-block;width:28px;height:28px;line-height:28px;border-radius:50%;background:#f5f5f7;color:#111}
body.light .cal .today span{background:#111;color:#fff}
.updated{position:absolute;right:24px;bottom:8px;font-size:8px;opacity:.25}

/* fullscreen clock */
#clockMode{display:none;position:fixed;z-index:50;left:0;top:0;width:100%;height:100%;background:#070809;color:#fff;text-align:center}
#clockMode.lightClock{background:#f7f7f8;color:#111}
.clockCenter{position:absolute;left:0;top:50%;width:100%;margin-top:-145px}
#bigClock{font-size:210px;line-height:215px;font-weight:200;letter-spacing:-9px;white-space:nowrap}
#bigDate{font-size:22px;opacity:.58;margin-top:4px}
#bigWeather{font-size:16px;opacity:.45;margin-top:12px}
#clockControls{position:absolute;left:0;bottom:20px;width:100%;transition:opacity .3s}
#clockControls.hidden{opacity:0}
.dot{display:inline-block;width:25px;height:25px;border-radius:50%;margin:0 5px;border:2px solid rgba(255,255,255,.3);vertical-align:middle}
.lightClock .dot{border-color:rgba(0,0,0,.2)}
.ctrl,#fontPicker{display:inline-block;padding:7px 9px;margin-left:5px;border:1px solid #4a4d52;border-radius:8px;background:transparent;color:inherit;font-size:11px}
#fontPicker option{color:#111}
@media(max-width:800px){#bigClock{font-size:185px;line-height:190px}.app{padding:18px 20px}.left{padding-right:20px}.right{padding-left:20px}}
</style>
</head>
<body>
<div class="app">
 <div class="top">
  <div class="time" id="clock">--:--</div>
  <div class="date" id="dateLine"></div>
  <div class="topRight">
   <div class="city"><button id="cityKoeln" onclick="setCity('koeln')">Köln</button><button id="cityFrankfurt" onclick="setCity('frankfurt')">Frankfurt</button></div>
   <div class="theme" style="margin-top:7px"><button id="thLight" onclick="setTheme('light')">☀</button><button id="thAuto" onclick="setTheme('auto')">Auto</button><button id="thDark" onclick="setTheme('dark')">☾</button></div>
   <button class="clockButton" onclick="openClock()">Große Uhr</button>
  </div>
 </div>
 <div class="grid">
  <div class="left">
   <div class="eyebrow" id="weatherTitle">Wetter</div>
   <div class="temp" id="temp">--°</div>
   <div class="condition" id="condition">Daten werden geladen</div>
   <div class="range" id="range"></div>
   <div class="forecast" id="forecast"></div>
   <div class="eyebrow noteTitle">Heute wichtig</div>
   <textarea id="note" placeholder="Kurze Notiz …"></textarea>
  </div>
  <div class="right">
   <div class="eyebrow">Kalender</div>
   <div class="month" id="monthTitle"></div>
   <table class="cal"><thead><tr><th>MO</th><th>DI</th><th>MI</th><th>DO</th><th>FR</th><th>SA</th><th>SO</th></tr></thead><tbody id="calBody"></tbody></table>
  </div>
 </div>
 <div class="updated" id="updated"></div>
</div>

<div id="clockMode" onclick="clockTap()">
 <div class="clockCenter" id="clockCenter">
  <div id="bigClock">--:--</div>
  <div id="bigDate"></div>
  <div id="bigWeather"></div>
 </div>
 <div id="clockControls" onclick="event.cancelBubble=true">
  <span class="dot" style="background:#fff" onclick="setClockColor('#ffffff')"></span>
  <span class="dot" style="background:#39ff72" onclick="setClockColor('#39ff72')"></span>
  <span class="dot" style="background:#48a7ff" onclick="setClockColor('#48a7ff')"></span>
  <span class="dot" style="background:#ff4b4b" onclick="setClockColor('#ff4b4b')"></span>
  <span class="dot" style="background:#ffb13b" onclick="setClockColor('#ffb13b')"></span>
  <span class="dot" style="background:#d17cff" onclick="setClockColor('#d17cff')"></span>
  <span class="ctrl" onclick="changeSize(-10)">A−</span><span class="ctrl" onclick="changeSize(10)">A+</span>
  <select id="fontPicker" onchange="setClockFont(this.value)">
   <option value="helvetica">Helvetica</option><option value="arial">Arial</option><option value="georgia">Georgia</option><option value="times">Times</option><option value="courier">Courier</option><option value="trebuchet">Trebuchet</option>
  </select>
  <span class="ctrl" onclick="closeClock()">Dashboard</span>
 </div>
</div>

<script id="embeddedDashboardData">var DASHBOARD_DATA={"updated":"01.10. 04:32","cities":{"koeln":{"weather":{"current":20.4,"text":"Nieselregen","days":[{"name":"Heute","max":23.1,"min":18.1,"rain":90},{"name":"Morgen","max":20.6,"min":14.6,"rain":86},{"name":"Übermorgen","max":19.7,"min":13.2,"rain":2}]},"sun":{"sunrise":"07:32","sunset":"19:10"}},"frankfurt":{"weather":{"current":18.4,"text":"Bewölkt","days":[{"name":"Heute","max":21.3,"min":17.1,"rain":98},{"name":"Morgen","max":21.9,"min":13.3,"rain":88},{"name":"Übermorgen","max":21.6,"min":11.6,"rain":0}]},"sun":{"sunrise":"07:25","sunset":"19:03"}}}};</script>
<script>
var DAYS=["Sonntag","Montag","Dienstag","Mittwoch","Donnerstag","Freitag","Samstag"],MONTHS=["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
var dashboardData=null,sunData=null,hideTimer=null;
function pad(n){return n<10?"0"+n:n}
function week(d){var x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()+3-(x.getDay()+6)%7);var w=new Date(x.getFullYear(),0,4);return 1+Math.round(((x-w)/86400000-3+(w.getDay()+6)%7)/7)}
function tick(){var d=new Date(),t=pad(d.getHours())+":"+pad(d.getMinutes());document.getElementById("clock").innerHTML=t;document.getElementById("dateLine").innerHTML=DAYS[d.getDay()]+" · "+d.getDate()+". "+MONTHS[d.getMonth()]+" "+d.getFullYear()+" · KW "+week(d);updateBig()}
setInterval(tick,1000);
function calendar(){var d=new Date(),y=d.getFullYear(),m=d.getMonth(),first=new Date(y,m,1),off=(first.getDay()+6)%7,n=1,nx=1,prev=new Date(y,m,0).getDate(),max=new Date(y,m+1,0).getDate(),s="",r,c,p,v,cl;
document.getElementById("monthTitle").innerHTML=MONTHS[m]+" "+y;
for(r=0;r<6;r++){s+="<tr>";for(c=0;c<7;c++){p=r*7+c;cl="";if(p<off){v=prev-off+p+1;cl="dim"}else if(n<=max){v=n;if(n==d.getDate())cl="today";n++}else{v=nx++;cl="dim"}s+='<td class="'+cl+'"><span>'+v+"</span></td>"}s+="</tr>"}document.getElementById("calBody").innerHTML=s}
function getStore(k,d){try{return localStorage.getItem(k)||d}catch(e){return d}}
function setStore(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function getCity(){return getStore("weatherCity","koeln")}
function setCity(c){setStore("weatherCity",c);renderCity()}
function renderCity(){if(!dashboardData)return;var c=getCity(),x=dashboardData.cities[c],name=c=="frankfurt"?"Frankfurt":"Köln";if(!x)return;
document.getElementById("temp").innerHTML=Math.round(x.weather.current)+"°";document.getElementById("condition").innerHTML=x.weather.text;document.getElementById("weatherTitle").innerHTML="Wetter · "+name;
var d=x.weather.days[0];document.getElementById("range").innerHTML="H "+Math.round(d.max)+"° · T "+Math.round(d.min)+"° · Regen "+d.rain+"%";
var s="",i,q;for(i=0;i<x.weather.days.length;i++){q=x.weather.days[i];s+='<div class="day"><div class="dayName">'+q.name+'</div><div class="dayTemp">'+Math.round(q.max)+'°</div><div class="daySub">'+Math.round(q.min)+'° · '+q.rain+'%</div></div>'}document.getElementById("forecast").innerHTML=s;
sunData=x.sun;document.getElementById("cityKoeln").className=c=="koeln"?"active":"";document.getElementById("cityFrankfurt").className=c=="frankfurt"?"active":"";document.getElementById("updated").innerHTML="Aktualisiert "+dashboardData.updated;applyTheme();updateBig()}
function renderData(j){if(!j||!j.cities)return;dashboardData=j;renderCity()}
function xhrJSON(url,ok){var x=new XMLHttpRequest();x.onreadystatechange=function(){if(x.readyState==4&&(x.status>=200&&x.status<300)){try{ok(JSON.parse(x.responseText))}catch(e){}}};x.open("GET",url+"?v="+new Date().getTime(),true);x.send()}
function load(){if(typeof DASHBOARD_DATA!="undefined"&&DASHBOARD_DATA&&DASHBOARD_DATA.cities)renderData(DASHBOARD_DATA);else xhrJSON("data.json",renderData)}
function mins(v){if(!v)return 0;var a=v.split(":");return parseInt(a[0],10)*60+parseInt(a[1],10)}
function setTheme(v){setStore("themeMode",v);applyTheme()}
function applyTheme(){var m=getStore("themeMode","auto"),light=false;if(m=="light")light=true;else if(m=="dark")light=false;else if(sunData){var d=new Date(),n=d.getHours()*60+d.getMinutes();light=!(n<mins(sunData.sunrise)||n>=mins(sunData.sunset))}else light=true;
document.body.className=light?"light":"";document.getElementById("clockMode").className=light?"lightClock":"";
document.getElementById("thLight").className=m=="light"?"active":"";document.getElementById("thAuto").className=m=="auto"?"active":"";document.getElementById("thDark").className=m=="dark"?"active":""}
function openClock(){document.getElementById("clockMode").style.display="block";showControls();updateBig()}
function closeClock(){document.getElementById("clockMode").style.display="none"}
function clockTap(){var c=document.getElementById("clockControls");if(c.className=="hidden")showControls();else hideControls()}
function showControls(){var c=document.getElementById("clockControls");c.className="";if(hideTimer)clearTimeout(hideTimer);hideTimer=setTimeout(hideControls,5000)}
function hideControls(){document.getElementById("clockControls").className="hidden"}
function setClockColor(v){setStore("clockColor",v);applyClockStyle();showControls()}
function changeSize(d){var n=parseInt(getStore("clockSize","210"),10)+d;if(n<130)n=130;if(n>250)n=250;setStore("clockSize",""+n);applyClockStyle();showControls()}
function setClockFont(v){setStore("clockFont",v);applyClockStyle();showControls()}
function applyClockStyle(){var c=document.getElementById("clockCenter"),b=document.getElementById("bigClock"),col=getStore("clockColor","#ffffff"),f=getStore("clockFont","helvetica"),n=parseInt(getStore("clockSize","210"),10),ff='"Helvetica Neue",Helvetica,Arial,sans-serif';
if(f=="arial")ff="Arial,sans-serif";else if(f=="georgia")ff="Georgia,serif";else if(f=="times")ff='"Times New Roman",Times,serif';else if(f=="courier")ff='"Courier New",Courier,monospace';else if(f=="trebuchet")ff='"Trebuchet MS",Arial,sans-serif';
c.style.color=col;b.style.fontFamily=ff;b.style.fontSize=n+"px";b.style.lineHeight=(n+5)+"px";document.getElementById("fontPicker").value=f}
function updateBig(){var d=new Date();document.getElementById("bigClock").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());document.getElementById("bigDate").innerHTML=DAYS[d.getDay()]+" · "+d.getDate()+". "+MONTHS[d.getMonth()]+" · KW "+week(d);
if(dashboardData){var c=getCity(),x=dashboardData.cities[c],name=c=="frankfurt"?"Frankfurt":"Köln";if(x)document.getElementById("bigWeather").innerHTML=name+" · "+Math.round(x.weather.current)+"° · "+x.weather.text}applyClockStyle()}
var note=document.getElementById("note");note.value=getStore("deskNote","");note.onkeyup=note.onchange=function(){setStore("deskNote",note.value)};
calendar();tick();load();setInterval(load,1800000);setInterval(applyTheme,60000);
</script>
</body></html>
